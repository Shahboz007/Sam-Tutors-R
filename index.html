<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111629">
  <meta name="description" content="Sam Tutors o‘quv markaziga kurslar uchun ro‘yxatdan o‘ting. Samarqand.">
  <title>Sam Tutors — Ro‘yxatdan o‘tish</title>
  <style>
    :root{--navy:#111629;--ink:#0b1248;--blue:#159cf5;--cyan:#20b8e8;--muted:#7f86a6;--line:#e0e4ec}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--navy);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    .topbar{max-width:980px;margin:auto;padding:26px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:white}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.4px}
    .logo{width:48px;height:48px;border:2px solid white;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:900;flex-shrink:0}
    .brand-name{font-size:21px;line-height:1.05}.brand-sub{font-size:10px;letter-spacing:1.4px;margin-top:5px}
    .location{font-size:14px;color:#e6e9f4;white-space:nowrap}
    main{max-width:800px;margin:76px auto 56px;padding:0 20px}
    .panel{background:#fff;border:4px solid var(--blue);border-radius:54px;padding:54px 54px 48px;box-shadow:0 18px 60px #00000012}
    h1{text-align:center;font-size:clamp(27px,4vw,42px);line-height:1.28;letter-spacing:-1.1px;margin:0 0 42px;color:var(--ink)}
    form{display:grid;gap:22px}
    .field{width:100%;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:13px 0 15px;background:white;font:inherit;font-size:20px;color:var(--ink);outline:none}
    .field:focus{border-bottom-color:var(--blue)}
    .field::placeholder{color:var(--muted);opacity:1}
    select.field{color:var(--muted);appearance:auto}
    select.field:valid{color:var(--ink)}
    .consent{display:flex;align-items:flex-start;gap:10px;color:#646b8b;font-size:13px;line-height:1.5}
    .consent input{margin-top:3px;accent-color:var(--blue)}
    button{margin-top:14px;width:100%;border:0;border-radius:28px;background:linear-gradient(100deg,#129bff,#24b7e8);color:white;padding:20px 16px;font:inherit;font-size:20px;cursor:pointer;transition:opacity .2s}
    button:hover{opacity:.92}button:disabled{opacity:.6;cursor:wait}
    .note{text-align:center;color:var(--muted);font-size:16px;line-height:1.55;margin:28px 0 0}
    .status{display:none;padding:13px 15px;border-radius:12px;font-size:15px;line-height:1.45}
    .status.show{display:block}.status.ok{background:#e8f8ee;color:#176b3b}.status.err{background:#fff0f0;color:#9b2222}
    .footer{text-align:center;color:#a8aec5;font-size:12px;padding:0 20px 28px}
    .hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
    @media(max-width:600px){.topbar{padding:22px 20px}.logo{width:42px;height:42px}.brand-name{font-size:18px}.location{font-size:12px}main{margin:36px auto 40px;padding:0 16px}.panel{border-radius:36px;padding:35px 24px 30px;border-width:3px}h1{margin-bottom:27px;letter-spacing:-.6px}.field{font-size:18px}form{gap:18px}button{font-size:18px;padding:18px 12px}.note{font-size:14px;margin-top:22px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Sam Tutors">
      <!-- Hozircha matnli belgi. O‘z logotipingizni qo‘shish uchun logo faylini assets/logo.png qilib joylang. -->
      <div class="logo" aria-hidden="true">ST</div>
      <div><div class="brand-name">SAM TUTORS</div><div class="brand-sub">O‘QUV MARKAZI</div></div>
    </div>
    <div class="location">📍 Samarqand</div>
  </header>
  <main>
    <section class="panel">
      <h1>Kurslarga yozilish uchun hoziroq ro‘yxatdan o‘ting</h1>
      <form id="registrationForm">
        <input class="field" name="fullName" placeholder="Ism-familiyangiz" autocomplete="name" minlength="3" maxlength="100" required>
        <input class="field" name="phone" placeholder="+998 90 123 45 67" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" required>
        <select class="field" name="age" required>
          <option value="" disabled selected>Yoshingizni tanlang</option>
          <option>7–10 yosh</option><option>11–14 yosh</option><option>15–17 yosh</option><option>18 yosh va undan katta</option>
        </select>
        <select class="field" name="course" required>
          <option value="" disabled selected>Kursni tanlang</option>
          <option>Ingliz tili</option><option>Rus tili</option><option>Ona tili</option>
          <option>Matematika</option><option>Tarix</option><option>Huquq</option>
        </select>
        <select class="field" name="branch" required>
          <option value="" disabled selected>Filialni tanlang</option>
          <option>Samarqand</option>
        </select>
        <label class="consent"><input type="checkbox" name="consent" required><span>Ma’lumotlarim bilan bog‘lanish va arizamni ko‘rib chiqish uchun foydalanilishiga roziman.</span></label>
        <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <button id="submitButton" type="submit">Menga qo‘ng‘iroq qiling!</button>
      </form>
      <p class="note">Arizangizni qoldiring — Sam Tutors jamoasi siz bilan bog‘lanadi.</p>
    </section>
  </main>
  <div class="footer">© <span id="year"></span> Sam Tutors · Samarqand</div>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const form = document.getElementById('registrationForm');
  const button = document.getElementById('submitButton');
  const statusBox = document.getElementById('status');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    statusBox.className = 'status';
    statusBox.textContent = '';
    if (!form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form).entries());
    if (data.website) return; // oddiy bot-spam himoyasi
    delete data.consent;
    delete data.website;
    button.disabled = true;
    button.textContent = 'Yuborilmoqda...';
    try {
      const response = await fetch('/.netlify/functions/register', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || 'Ariza yuborilmadi. Qayta urinib ko‘ring.');
      statusBox.className = 'status show ok';
      statusBox.textContent = 'Rahmat! Arizangiz yuborildi. Tez orada siz bilan bog‘lanamiz.';
      form.reset();
    } catch (error) {
      statusBox.className = 'status show err';
      statusBox.textContent = error.message || 'Internet bilan bog‘liq xatolik. Keyinroq urinib ko‘ring.';
    } finally {
      button.disabled = false;
      button.textContent = "Menga qo‘ng‘iroq qiling!";
    }
  });
</script>
</body>
</html>
